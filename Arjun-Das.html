<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arjun's Career Journey</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:40px;
}
.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}
h1{
    color:#0066cc;
    text-align:center;
}
.timeline{
    border-left:4px solid #0066cc;
    padding-left:20px;
}
.item{
    margin-bottom:25px;
    position:relative;
}
.item::before{
    content:"";
    width:14px;
    height:14px;
    background:#0066cc;
    border-radius:50%;
    position:absolute;
    left:-28px;
    top:5px;
}
.year{
    color:gray;
}
.role{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>Arjun's Career Journey</h1>

<div class="timeline">

<div class="item">
<div class="year">2017</div>
<div class="role">Graduate Trainee</div>
</div>

<div class="item">
<div class="year">2018</div>
<div class="role">Junior Developer</div>
</div>

<div class="item">
<div class="year">2020</div>
<div class="role">Software Engineer</div>
</div>

<div class="item">
<div class="year">2022</div>
<div class="role">Senior Software Engineer</div>
</div>

<div class="item">
<div class="year">2025</div>
<div class="role">Solution Architect</div>
</div>

</div>
</div>

</body>
</html>
