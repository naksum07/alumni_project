<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Feedback | AlumniConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="../scripts/data-store.js"></script>
<script src="../scripts/popup.js"></script>
<script src="../scripts/admin-common.js"></script>
</head>
<body class="bg-slate-50 font-sans">

<div class="admin-content">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <h1 class="text-3xl font-bold text-gray-800">Feedback Dashboard</h1>
    </div>

    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <table class="admin-table" id="feedbackTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>User</th>
                    <th>Status</th>
                    <th>Rating</th>
                    <th>Message</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
function getToken() {
    return typeof getAdminToken === 'function' ? getAdminToken() : (localStorage.getItem('adminToken') || localStorage.getItem('token'));
}

async function loadFeedback() {
    const tbody = document.querySelector('#feedbackTable tbody');
    if (!tbody) return;
    
    try {
        const res = await fetch('/api/feedback', { headers: { 'Authorization': 'Bearer ' + getToken() } });
        if (!res.ok) {
            if (res.status === 401 || res.status === 403) {
                if (typeof clearAdminTokens === 'function') clearAdminTokens();
                return window.location.href = 'login.html';
            }
            throw new Error('Failed to load feedback');
        }
        
        const feedbacks = await res.json();
        tbody.innerHTML = '';
        
        if (feedbacks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-gray-500">No feedback submitted yet.</td></tr>';
            return;
        }

        feedbacks.forEach(f => {
            const dateStr = new Date(f.created_at).toLocaleDateString();
            const stars = Array(5).fill(0).map((_, i) => i < f.rating ? '<i class="fa-solid fa-star text-yellow-400 text-xs"></i>' : '<i class="fa-solid fa-star text-gray-300 text-xs"></i>').join('');
            
            const isRegistered = !!f.author_name;
            const badge = isRegistered 
                ? '<span class="px-2 py-1 rounded text-xs font-semibold bg-green-100 text-green-800">Registered</span>' 
                : '<span class="px-2 py-1 rounded text-xs font-semibold bg-gray-100 text-gray-800">Not Registered</span>';
            const nameDisplay = isRegistered ? f.author_name : 'Anonymous';

            tbody.innerHTML += `
                <tr>
                    <td class="font-medium whitespace-nowrap">${dateStr}</td>
                    <td class="whitespace-nowrap">${nameDisplay}</td>
                    <td class="whitespace-nowrap">${badge}</td>
                    <td class="whitespace-nowrap flex gap-0.5 mt-1">${stars}</td>
                    <td class="text-gray-700 min-w-[300px]">${f.message}</td>
                    <td>
                        <button onclick="deleteFeedbackItem(${f.id})" class="text-red-600 hover:text-red-800" title="Delete">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-red-500">${err.message}</td></tr>`;
    }
}

window.deleteFeedbackItem = async (id) => {
    showConfirmPopup('Are you sure you want to delete this feedback item?', 'Delete Feedback', async () => {
        try {
            const res = await fetch('/api/admin/feedback/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (!res.ok) throw new Error('Failed to delete feedback');
            showPopup('Feedback deleted successfully.', 'success');
            loadFeedback();
        } catch (err) {
            showPopup(err.message || 'Error deleting feedback', 'error');
        }
    }, null, 'Delete', 'Cancel');
};

document.addEventListener('DOMContentLoaded', loadFeedback);
</script>

</body>
</html>
