 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Events | AlumniConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="../scripts/data-store.js"></script>
<script src="../scripts/popup.js"></script>
<script src="../scripts/admin-common.js"></script>
</head>
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Manage Events</h1>
        <button onclick="document.getElementById('addEventModal').classList.remove('hidden')" class="bg-[#c4161c] hover:bg-[#a01217] text-white px-5 py-2.5 rounded-xl shadow-sm flex items-center gap-2 font-semibold transition">
            <i class="fa-solid fa-plus"></i> New Event
        </button>
    </div>

    <!-- FILTERS CARD -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
            
            <!-- SEARCH -->
            <div class="md:col-span-2 relative">
                <span class="absolute left-4 top-3 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="searchInput" placeholder="Search title or desc..." class="w-full border border-slate-200 rounded-xl py-2.5 pl-10 pr-4 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition">
            </div>

            <!-- DATE RANGE -->
            <div class="flex gap-2 relative">
                <input type="date" id="dateFrom" class="w-1/2 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-blue-500 text-sm transition" title="From">
                <input type="date" id="dateTo" class="w-1/2 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-blue-500 text-sm transition" title="To">
            </div>

            <!-- STATUS -->
            <div class="relative">
                <select id="statusSelect" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm bg-white appearance-none transition">
                    <option value="">All Statuses</option>
                    <option value="upcoming">Upcoming</option>
                    <option value="ongoing">Ongoing</option>
                    <option value="completed">Completed</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
            </div>
            
        </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm overflow-hidden mb-4">
        <table class="admin-table" id="mainEventsTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Host</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Participants</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- PAGINATION CONTROLS -->
    <div id="evPagination" class="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl border border-slate-200 gap-4 mb-8 text-sm">
        <div class="text-slate-600 font-medium" id="evPaginationInfo">Showing 0 of 0 events</div>
        <div class="flex items-center gap-2">
            <button id="evPrevBtn" onclick="changeEvPage(-1)" class="px-3 py-1.5 border rounded-lg hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium text-slate-700 transition">
                <i class="fa-solid fa-chevron-left text-xs mr-1"></i> Prev
            </button>
            <span id="evPageNumber" class="px-3 py-1.5 bg-slate-100 rounded-lg font-semibold text-slate-800">Page 1</span>
            <button id="evNextBtn" onclick="changeEvPage(1)" class="px-3 py-1.5 border rounded-lg hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium text-slate-700 transition">
                Next <i class="fa-solid fa-chevron-right text-xs ml-1"></i>
            </button>
        </div>
    </div>
</div>

<!-- Add Event Modal -->
<div id="addEventModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 class="text-xl font-bold mb-4">Create New Event</h2>
        <form id="addEventForm">
            <div class="mb-3">
                <label class="block text-sm font-semibold mb-1">Title</label>
                <input type="text" id="evTitle" required class="w-full border rounded px-3 py-2">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-semibold mb-1">Host</label>
                <input type="text" id="evHost" required class="w-full border rounded px-3 py-2">
            </div>
            <div class="mb-3 grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-semibold mb-1">Start Date *</label>
                    <input type="date" id="evDate" required class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">End Date</label>
                    <input type="date" id="evDateEnd" class="w-full border rounded px-3 py-2 text-sm">
                </div>
            </div>
            <div class="mb-3 grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-semibold mb-1">Time (Start - End)</label>
                    <div class="flex items-center gap-2">
                        <input type="time" id="evTimeStart" class="w-full border rounded px-2 py-2 text-sm">
                        <span class="text-gray-500">-</span>
                        <input type="time" id="evTimeEnd" class="w-full border rounded px-2 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Venue</label>
                    <input type="text" id="evVenue" placeholder="e.g. College Auditorium" class="w-full border rounded px-3 py-2">
                </div>
            </div>
            <div class="mb-3">
                <label class="block text-sm font-semibold mb-1">Description</label>
                <textarea id="evDesc" rows="3" placeholder="Brief event description..." class="w-full border rounded px-3 py-2"></textarea>
            </div>
            <div class="mb-5">
                <label class="block text-sm font-semibold mb-1">Status</label>
                <select id="evStatus" class="w-full border rounded px-3 py-2">
                    <option value="upcoming">Upcoming</option>
                    <option value="ongoing">Ongoing</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <div class="flex justify-end gap-3">
                <button type="button" onclick="document.getElementById('addEventModal').classList.add('hidden')" class="px-4 py-2 text-gray-600 bg-gray-100 rounded hover:bg-gray-200">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-[#012970] text-white rounded hover:bg-[#011a47]">Save Event</button>
            </div>
        </form>
    </div>
</div>

<!-- Participants Modal -->
<div id="participantsModal" class="modal-overlay hidden">
    <div class="modal-content max-w-2xl">
        <h2 class="text-xl font-bold mb-4">Event Participants</h2>
        <div class="max-h-64 overflow-y-auto mb-4 border rounded">
            <table class="admin-table text-sm w-full">
                <thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead>
                <tbody id="participantsList"></tbody>
            </table>
        </div>
        <div class="flex justify-end">
            <button type="button" onclick="document.getElementById('participantsModal').classList.add('hidden')" class="px-4 py-2 bg-gray-100 text-gray-700 rounded hover:bg-gray-200">Close</button>
        </div>
    </div>
</div>

<script>
function getToken() {
    return typeof getAdminToken === 'function' ? getAdminToken() : (localStorage.getItem('adminToken') || localStorage.getItem('token'));
}

let searchTimeout;
let allEventsList = [];
let evCurrentPage = 1;
const evPerPage = 10;

function changeEvPage(delta) {
    const totalPages = Math.ceil(allEventsList.length / evPerPage) || 1;
    const newPage = evCurrentPage + delta;
    if (newPage >= 1 && newPage <= totalPages) {
        evCurrentPage = newPage;
        renderEventsTable();
    }
}

function formatAdminDate(dateStr) {
    if (!dateStr) return '';
    let str = String(dateStr).trim();
    if (str.includes('T')) str = str.split('T')[0];
    const parts = str.split('-');
    if (parts.length === 3 && parts[0].length === 4) {
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        const d = new Date(year, month, day);
        if (!isNaN(d.getTime())) return d.toLocaleDateString();
    }
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString();
}

function renderEventsTable() {
    const tbody = document.querySelector('#mainEventsTable tbody');
    if (!tbody) return;

    if (!allEventsList.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-gray-500">No events found.</td></tr>';
        document.getElementById('evPaginationInfo').textContent = 'Showing 0 of 0 events';
        document.getElementById('evPageNumber').textContent = 'Page 1 of 1';
        document.getElementById('evPrevBtn').disabled = true;
        document.getElementById('evNextBtn').disabled = true;
        return;
    }

    const totalPages = Math.ceil(allEventsList.length / evPerPage) || 1;
    if (evCurrentPage > totalPages) evCurrentPage = totalPages;

    const startIdx = (evCurrentPage - 1) * evPerPage;
    const endIdx = Math.min(startIdx + evPerPage, allEventsList.length);
    const pageItems = allEventsList.slice(startIdx, endIdx);

    tbody.innerHTML = '';
    pageItems.forEach(e => {
        const title = e.title || e.name || 'Untitled';
        let dateStr = e.date ? formatAdminDate(e.date) : '';
        if (e.event_date_end) {
             dateStr += ' - ' + formatAdminDate(e.event_date_end);
        }
        const badgeColor = e.status === 'completed' ? 'bg-green-100 text-green-800' : e.status === 'ongoing' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800';
        tbody.innerHTML += `
            <tr>
                <td class="font-medium">${title}</td>
                <td>${e.host || 'Admin'}</td>
                <td>${dateStr}</td>
                <td><span class="px-2 py-1 rounded text-xs font-semibold uppercase ${badgeColor}">${e.status || 'upcoming'}</span></td>
                <td>${e.participantCount || 0}</td>
                <td>
                    <button onclick="viewParticipants(${e.id})" class="text-blue-600 hover:text-blue-800 mr-3" title="View Participants"><i class="fa-solid fa-users"></i></button>
                    <button onclick="deleteEvent(${e.id})" class="text-red-600 hover:text-red-800" title="Delete"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `;
    });

    document.getElementById('evPaginationInfo').textContent = `Showing ${startIdx + 1}–${endIdx} of ${allEventsList.length} events`;
    document.getElementById('evPageNumber').textContent = `Page ${evCurrentPage} of ${totalPages}`;
    document.getElementById('evPrevBtn').disabled = evCurrentPage === 1;
    document.getElementById('evNextBtn').disabled = evCurrentPage === totalPages;
}

async function loadEvents() {
    const search = document.getElementById('searchInput')?.value;
    const dateFrom = document.getElementById('dateFrom')?.value;
    const dateTo = document.getElementById('dateTo')?.value;
    const status = document.getElementById('statusSelect')?.value;

    const params = new URLSearchParams();
    if (search) params.append('search', search);
    if (dateFrom) params.append('date_from', dateFrom);
    if (dateTo) params.append('date_to', dateTo);
    if (status) params.append('status', status);

    const res = await fetch('/api/admin/events?' + params.toString(), { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
            if (typeof clearAdminTokens === 'function') clearAdminTokens();
            return window.location.href = 'login.html';
        }
        console.error('Failed to load events:', res.status);
        return;
    }
    const data = await res.json();
    allEventsList = Array.isArray(data) ? data : [];
    evCurrentPage = 1;
    renderEventsTable();
}

document.getElementById('addEventForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newEvent = {
        name: document.getElementById('evTitle').value,
        title: document.getElementById('evTitle').value,
        host: document.getElementById('evHost').value,
        eventDate: document.getElementById('evDate').value,
        date: document.getElementById('evDate').value,
        eventDateEnd: document.getElementById('evDateEnd')?.value || null,
        eventTime: ((document.getElementById('evTimeStart')?.value && document.getElementById('evTimeEnd')?.value) ? (document.getElementById('evTimeStart').value + ' - ' + document.getElementById('evTimeEnd').value) : null),
        venue: document.getElementById('evVenue')?.value || null,
        description: document.getElementById('evDesc')?.value || null,
        status: document.getElementById('evStatus').value
    };
    try {
        const res = await fetch('/api/admin/events', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('adminToken') || getToken()), 'Content-Type': 'application/json' },
            body: JSON.stringify(newEvent)
        });
        if (!res.ok) throw new Error('Failed to create event');
        document.getElementById('addEventModal').classList.add('hidden');
        document.getElementById('addEventForm').reset();
        showPopup('Event created successfully!', 'success');
        loadEvents();
    } catch (e) {
        console.error(e);
        showPopup('Could not save event. Please try again.', 'error');
    }
});

window.deleteEvent = async (id) => {
    showConfirmPopup('Are you sure you want to delete this event?', 'Delete Event', async () => {
        try {
            const res = await fetch('/api/admin/events/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (!res.ok) {
                showPopup('Failed to delete event.', 'error');
                return;
            }
            showPopup('Event deleted successfully.', 'success');
            loadEvents();
        } catch (e) {
            console.error(e);
            showPopup('Network error while deleting event.', 'network');
        }
    }, null, 'Delete', 'Cancel');
};

window.viewParticipants = async (id) => {
    const res = await fetch('/api/admin/events/' + id + '/registrations', { headers: { 'Authorization': 'Bearer ' + getToken() } });
    const data = await res.json();
    const participants = Array.isArray(data) ? data : [];
    const tbody = document.getElementById('participantsList');
    if (tbody) {
        tbody.innerHTML = participants.length ? '' : '<tr><td colspan="3" class="text-center py-4 text-gray-500">No participants registered yet.</td></tr>';
        participants.forEach(p => {
            tbody.innerHTML += `<tr><td>${p.full_name}</td><td>${p.email}</td><td>${p.phone || 'N/A'}</td></tr>`;
        });
    }
    document.getElementById('participantsModal').classList.remove('hidden');
};

document.addEventListener('DOMContentLoaded', () => {
    const url = new URL(window.location);
    if (url.searchParams.get('search')) document.getElementById('searchInput').value = url.searchParams.get('search');
    if (url.searchParams.get('date_from')) document.getElementById('dateFrom').value = url.searchParams.get('date_from');
    if (url.searchParams.get('date_to')) document.getElementById('dateTo').value = url.searchParams.get('date_to');
    if (url.searchParams.get('status')) document.getElementById('statusSelect').value = url.searchParams.get('status');

    loadEvents();

    const updateUrlAndReload = () => {
        const currentUrl = new URL(window.location);
        const search = document.getElementById('searchInput').value;
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;
        const status = document.getElementById('statusSelect').value;

        if (search) currentUrl.searchParams.set('search', search);
        else currentUrl.searchParams.delete('search');

        if (dateFrom) currentUrl.searchParams.set('date_from', dateFrom);
        else currentUrl.searchParams.delete('date_from');

        if (dateTo) currentUrl.searchParams.set('date_to', dateTo);
        else currentUrl.searchParams.delete('date_to');

        if (status) currentUrl.searchParams.set('status', status);
        else currentUrl.searchParams.delete('status');

        window.history.replaceState({}, '', currentUrl);
        loadEvents();
    };

    document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(updateUrlAndReload, 300);
    });

    ['dateFrom', 'dateTo', 'statusSelect'].forEach(id => {
        document.getElementById(id).addEventListener('change', updateUrlAndReload);
    });
});
</script>

</body>
</html>
