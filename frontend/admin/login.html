<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | AlumniConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="../scripts/data-store.js"></script>
<script src="../scripts/admin-common.js"></script>
<style>
    html {
       scroll-behavior: smooth;
    }
    body { 
      overflow-x: hidden; 
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }
    .shake-card {
        animation: shake 0.4s ease-in-out;
    }
    .input-error {
        border-color: #ef4444 !important;
        background-color: #fef2f2 !important;
    }
    .input-error:focus {
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25) !important;
    }
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-100 text-slate-800 p-4">

<div id="adminCard" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-200 transition-all">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#012970]/10 text-[#012970] mb-3">
            <i class="fa-solid fa-user-shield text-2xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-[#012970]">Admin Access</h1>
        <p class="text-slate-500 mt-1 text-sm">Secure Management Portal Login</p>
    </div>

    <!-- ENHANCED ALERT BANNER -->
    <div id="adminAlert" class="hidden mb-6 rounded-xl p-4 text-sm transition-all duration-300 border shadow-sm flex items-start gap-3">
        <div id="adminAlertIconContainer" class="p-2 rounded-lg shrink-0 flex items-center justify-center">
            <i id="adminAlertIcon" class="fa-solid fa-circle-exclamation text-base"></i>
        </div>
        <div class="flex-1 pt-0.5">
            <h4 id="adminAlertTitle" class="font-bold text-xs uppercase tracking-wider mb-0.5"></h4>
            <p id="adminAlertText" class="text-sm leading-relaxed"></p>
            <div id="adminAlertAction" class="mt-2 text-xs hidden"></div>
        </div>
    </div>

    <form id="adminLoginForm" novalidate>
        <div class="mb-4">
            <div class="flex justify-between items-center mb-1.5">
                <label class="block text-slate-700 font-semibold text-xs uppercase tracking-wide">Username or Email</label>
                <span id="usernameError" class="text-xs font-medium text-red-600 hidden"></span>
            </div>
            <input type="text" id="username" required class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#012970] focus:ring-2 focus:ring-[#012970]/20 transition-colors">
        </div>
        <div class="mb-6">
            <div class="flex justify-between items-center mb-1.5">
                <label class="block text-slate-700 font-semibold text-xs uppercase tracking-wide">Passcode</label>
                <span id="passcodeError" class="text-xs font-medium text-red-600 hidden"></span>
            </div>
            <div class="relative">
                <input type="password" id="passcode" required class="w-full border border-slate-300 rounded-lg px-4 py-2.5 pr-10 text-sm focus:outline-none focus:border-[#012970] focus:ring-2 focus:ring-[#012970]/20 transition-colors">
                <button type="button" onclick="togglePasscode()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none p-1">
                    <i id="toggleIcon" class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" id="adminSubmitBtn" class="w-full bg-[#012970] hover:bg-[#011a47] text-white py-3 rounded-lg font-semibold transition-all duration-200 shadow-md flex items-center justify-center gap-2">
            <span>Login to Dashboard</span>
        </button>
    </form>
    
    <div class="mt-6 text-center text-sm">
        <a href="../pages/index.html" class="text-slate-500 hover:text-[#c4161c] inline-flex items-center gap-1 font-medium transition">
            <i class="fa-solid fa-arrow-left text-xs"></i> Back to Public Site
        </a>
    </div>
</div>

<script>
function togglePasscode() {
    const input = document.getElementById('passcode');
    const icon = document.getElementById('toggleIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

const adminCard = document.getElementById('adminCard');
const adminAlert = document.getElementById('adminAlert');
const adminAlertIconContainer = document.getElementById('adminAlertIconContainer');
const adminAlertIcon = document.getElementById('adminAlertIcon');
const adminAlertTitle = document.getElementById('adminAlertTitle');
const adminAlertText = document.getElementById('adminAlertText');
const adminAlertAction = document.getElementById('adminAlertAction');

const usernameInput = document.getElementById('username');
const passcodeInput = document.getElementById('passcode');
const usernameError = document.getElementById('usernameError');
const passcodeError = document.getElementById('passcodeError');
const submitBtn = document.getElementById('adminSubmitBtn');

[usernameInput, passcodeInput].forEach(input => {
    input.addEventListener('input', () => {
        input.classList.remove('input-error');
        if (input.id === 'username') usernameError.classList.add('hidden');
        if (input.id === 'passcode') passcodeError.classList.add('hidden');
    });
});

function showAdminAlert(text, type = 'error', actionHtml = '') {
    const adminAlert = document.getElementById('adminAlert');
    const adminAlertIconContainer = document.getElementById('adminAlertIconContainer');
    const adminAlertIcon = document.getElementById('adminAlertIcon');
    const adminAlertTitle = document.getElementById('adminAlertTitle');
    const adminAlertText = document.getElementById('adminAlertText');
    const adminAlertAction = document.getElementById('adminAlertAction');

    if (!adminAlert) return;

    adminAlert.classList.remove("hidden", "bg-red-50", "border-red-200", "text-red-900", "bg-emerald-50", "border-emerald-200", "text-emerald-900", "bg-rose-50", "border-rose-200", "text-rose-900");
    adminAlertIconContainer.classList.remove("bg-red-100", "text-red-600", "bg-emerald-100", "text-emerald-600", "bg-rose-100", "text-rose-600");
    adminAlertIcon.className = '';

    if (type === 'error') {
        adminAlert.classList.add("bg-red-50", "border-red-200", "text-red-900");
        adminAlertIconContainer.classList.add("bg-red-100", "text-red-600");
        adminAlertIcon.className = "fa-solid fa-circle-xmark text-base";
        adminAlertTitle.textContent = "Access Denied";
    } else if (type === 'network') {
        adminAlert.classList.add("bg-rose-50", "border-rose-200", "text-rose-900");
        adminAlertIconContainer.classList.add("bg-rose-100", "text-rose-600");
        adminAlertIcon.className = "fa-solid fa-wifi text-base";
        adminAlertTitle.textContent = "Connection Error";
    } else if (type === 'success') {
        adminAlert.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-900");
        adminAlertIconContainer.classList.add("bg-emerald-100", "text-emerald-600");
        adminAlertIcon.className = "fa-solid fa-circle-check text-base";
        adminAlertTitle.textContent = "Success";
    }

    adminAlertText.textContent = text;

    if (actionHtml) {
        adminAlertAction.innerHTML = actionHtml;
        adminAlertAction.classList.remove('hidden');
    } else {
        adminAlertAction.classList.add('hidden');
    }

    adminAlert.classList.remove("hidden");
}

function triggerShake() {
    adminCard.classList.remove('shake-card');
    void adminCard.offsetWidth; // Force reflow
    adminCard.classList.add('shake-card');
}

function getApiUrl(endpoint) {
    const origin = window.location.origin;
    if (window.location.protocol === 'file:' || (origin && !origin.endsWith(':5001'))) {
        return `http://localhost:5001${endpoint.startsWith('/') ? endpoint : '/' + endpoint}`;
    }
    return endpoint;
}

document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = usernameInput.value.trim();
    const p = passcodeInput.value;

    let hasValidationError = false;

    if (!u) {
        usernameInput.classList.add('input-error');
        usernameError.textContent = "Username is required";
        usernameError.classList.remove('hidden');
        hasValidationError = true;
    }

    if (!p) {
        passcodeInput.classList.add('input-error');
        passcodeError.textContent = "Passcode is required";
        passcodeError.classList.remove('hidden');
        hasValidationError = true;
    }

    if (hasValidationError) {
        triggerShake();
        showAdminAlert("Please enter both administrator username/email and passcode.", 'error');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Verifying credentials...</span>`;

    try {
        const response = await fetch(getApiUrl('/api/admin/login'), { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, passcode: p}) 
        });
        
        if (response.ok) {
            const data = await response.json();
            usernameInput.classList.remove('input-error');
            passcodeInput.classList.remove('input-error');

            localStorage.setItem('adminToken', data.token);
            localStorage.setItem('token', data.token);
            if (data.user) {
                localStorage.setItem('user', JSON.stringify(data.user));
            } else {
                localStorage.setItem('user', JSON.stringify({ role: 'admin' }));
            }
            showAdminAlert("Admin access granted! Opening dashboard...", 'success');
            setTimeout(() => {
                window.location.href = '/admin/dashboard.html';
            }, 600);
        } else {
            triggerShake();
            usernameInput.classList.add('input-error');
            passcodeInput.classList.add('input-error');
            const data = await response.json();
            const message = data.message || 'Invalid admin credentials.';
            showAdminAlert(message, 'error');
        }
    } catch (err) {
        console.error(err);
        triggerShake();
        showAdminAlert("Could not reach backend server. Make sure server is running on port 5000.", 'network');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Login to Dashboard</span>`;
    }
});
</script>

</body>
</html>
