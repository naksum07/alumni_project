<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | AlumniConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="../scripts/data-store.js"></script>
<script src="../scripts/admin-common.js"></script>
<style>
    html {
       scroll-behavior: smooth;
     }
    body { 
      overflow-x: hidden; 
    }
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-100 text-slate-800 p-4">

<div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-[#012970]">Admin Access</h1>
        <p class="text-gray-500 mt-2 text-sm">Secure Portal Login</p>
    </div>

    <div id="errorMsg" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm font-medium"></div>

    <form id="adminLoginForm">
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2 text-sm">Username</label>
            <input type="text" id="username" required class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-[#012970]">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2 text-sm">Passcode</label>
            <div class="relative">
                <input type="password" id="passcode" required class="w-full border border-gray-300 rounded px-4 py-2 pr-10 focus:outline-none focus:border-[#012970]">
                <button type="button" onclick="togglePasscode()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                    <i id="toggleIcon" class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="w-full bg-[#012970] hover:bg-[#011a47] text-white py-3 rounded font-semibold transition">
            Login to Dashboard
        </button>
    </form>
    
    <div class="mt-6 text-center text-sm">
        <a href="/index.html" class="text-gray-500 hover:text-[#c4161c]">Back to Public Site</a>
    </div>
</div>

<script>
function togglePasscode() {
    const input = document.getElementById('passcode');
    const icon = document.getElementById('toggleIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('passcode').value;
    
    // TODO: REAL BACKEND INTEGRATION POINT
    // const response = await fetch('/api/admin/login', { method: 'POST', body: JSON.stringify({username: u, passcode: p}) });
    
    
    const response = await fetch('/api/admin/login', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, passcode: p}) 
    });
    
    if (response.ok) {
        const data = await response.json();
        localStorage.setItem('adminToken', data.token);
        localStorage.setItem('token', data.token);
        if (data.user) {
            localStorage.setItem('user', JSON.stringify(data.user));
        } else {
            localStorage.setItem('user', JSON.stringify({ role: 'admin' }));
        }
        window.location.href = '/admin/dashboard.html';
    } else {
        const err = document.getElementById('errorMsg');
        const data = await response.json();
        err.textContent = data.message || 'Invalid admin credentials.';
        err.classList.remove('hidden');
    }

});
</script>

</body>
</html>
