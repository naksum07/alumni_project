<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin News | AlumniConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="../scripts/data-store.js"></script>
<script src="../scripts/admin-common.js"></script>
</head>
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">News & Announcements</h1>
        <button onclick="document.getElementById('addNewsModal').classList.remove('hidden')" class="bg-[#c4161c] hover:bg-[#a01217] text-white px-5 py-2.5 rounded-xl shadow-sm flex items-center gap-2 font-semibold transition">
            <i class="fa-solid fa-plus"></i> New Post
        </button>
    </div>

    <!-- FILTERS CARD -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
            
            <!-- SEARCH -->
            <div class="md:col-span-2 relative">
                <span class="absolute left-4 top-3 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="searchInput" placeholder="Search title or content..." class="w-full border border-slate-200 rounded-xl py-2.5 pl-10 pr-4 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition">
            </div>

            <!-- DATE RANGE -->
            <div class="flex gap-2 relative">
                <input type="date" id="dateFrom" class="w-1/2 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-blue-500 text-sm transition" title="From">
                <input type="date" id="dateTo" class="w-1/2 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-blue-500 text-sm transition" title="To">
            </div>

            <!-- STATUS -->
            <div class="relative">
                <select id="statusSelect" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm bg-white appearance-none transition">
                    <option value="">All Statuses</option>
                    <option value="Published">Published</option>
                    <option value="Draft">Draft</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
            </div>
            
        </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <table class="admin-table" id="mainNewsTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Audience</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Add News Modal -->
<div id="addNewsModal" class="modal-overlay hidden">
    <div class="modal-content max-w-lg">
        <h2 class="text-xl font-bold mb-4">Create New Post</h2>
        <form id="addNewsForm">
            <div class="mb-3">
                <label class="block text-sm font-semibold mb-1">Title</label>
                <input type="text" id="newsTitle" required class="w-full border rounded px-3 py-2">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-semibold mb-1">Content</label>
                <textarea id="newsContent" required class="w-full border rounded px-3 py-2 h-24"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Category</label>
                    <select id="newsCat" class="w-full border rounded px-3 py-2">
                        <option value="News">News</option>
                        <option value="Announcement">Announcement</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Audience</label>
                    <select id="newsAudience" class="w-full border rounded px-3 py-2">
                        <option value="Everyone">Everyone</option>
                        <option value="Students only">Students only</option>
                        <option value="Alumni only">Alumni only</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button type="button" onclick="document.getElementById('addNewsModal').classList.add('hidden')" class="px-4 py-2 text-gray-600 bg-gray-100 rounded hover:bg-gray-200">Cancel</button>
                <button type="button" onclick="saveNews('Draft')" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">Save Draft</button>
                <button type="button" onclick="saveNews('Published')" class="px-4 py-2 bg-[#012970] text-white rounded hover:bg-[#011a47]">Publish Now</button>
            </div>
        </form>
    </div>
</div>

<script>
function getToken() {
    return typeof getAdminToken === 'function' ? getAdminToken() : (localStorage.getItem('adminToken') || localStorage.getItem('token'));
}

let searchTimeout;

async function loadNews() {
    const search = document.getElementById('searchInput')?.value;
    const dateFrom = document.getElementById('dateFrom')?.value;
    const dateTo = document.getElementById('dateTo')?.value;
    const status = document.getElementById('statusSelect')?.value;

    const params = new URLSearchParams();
    if (search) params.append('search', search);
    if (dateFrom) params.append('date_from', dateFrom);
    if (dateTo) params.append('date_to', dateTo);
    if (status) params.append('status', status);

    const res = await fetch('/api/admin/news?' + params.toString(), { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if (!res.ok) {
        if (typeof clearAdminTokens === 'function') clearAdminTokens();
        return window.location.href = 'login.html';
    }
    const data = await res.json();
    const news = Array.isArray(data) ? data : [];
    const tbody = document.querySelector('#mainNewsTable tbody');
    if (!tbody) return;
    tbody.innerHTML = news.length ? '' : '<tr><td colspan="6" class="text-center py-4 text-gray-500">No news or announcements found.</td></tr>';
    news.forEach(n => {
        const badgeColor = n.status === 'Published' ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-800';
        const toggleIcon = n.status === 'Published' ? 'fa-toggle-on text-green-600' : 'fa-toggle-off text-gray-400';
        const dateStr = n.publish_date ? new Date(n.publish_date).toLocaleDateString() : 'N/A';
        tbody.innerHTML += `
            <tr>
                <td class="font-medium">${n.title || 'Untitled'}</td>
                <td>${n.category || 'News'}</td>
                <td>${n.visibility || 'Everyone'}</td>
                <td><span class="px-2 py-1 rounded text-xs font-semibold ${badgeColor}">${n.status || 'Draft'}</span></td>
                <td>${dateStr}</td>
                <td>
                    <button onclick="toggleNews(${n.id})" class="text-xl mr-3" title="Toggle Status"><i class="fa-solid ${toggleIcon}"></i></button>
                    <button onclick="deleteNews(${n.id})" class="text-red-600 hover:text-red-800" title="Delete"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `;
    });
}

window.saveNews = async (status) => {
    const title = document.getElementById('newsTitle').value;
    if (!title) return alert("Title required");
    const newPost = {
        title: title,
        content: document.getElementById('newsContent').value,
        category: document.getElementById('newsCat').value,
        audience: document.getElementById('newsAudience').value,
        status: status
    };
    await fetch('/api/admin/news', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
        body: JSON.stringify(newPost)
    });
    document.getElementById('addNewsModal').classList.add('hidden');
    document.getElementById('addNewsForm').reset();
    loadNews();
};

window.toggleNews = async (id) => {
    await fetch('/api/admin/news/' + id + '/toggle', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    loadNews();
};

window.deleteNews = async (id) => {
    if (confirm('Are you sure you want to delete this post?')) {
        await fetch('/api/admin/news/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        loadNews();
    }
};

document.addEventListener('DOMContentLoaded', () => {
    const url = new URL(window.location);
    if (url.searchParams.get('search')) document.getElementById('searchInput').value = url.searchParams.get('search');
    if (url.searchParams.get('date_from')) document.getElementById('dateFrom').value = url.searchParams.get('date_from');
    if (url.searchParams.get('date_to')) document.getElementById('dateTo').value = url.searchParams.get('date_to');
    if (url.searchParams.get('status')) document.getElementById('statusSelect').value = url.searchParams.get('status');

    loadNews();

    const updateUrlAndReload = () => {
        const currentUrl = new URL(window.location);
        const search = document.getElementById('searchInput').value;
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;
        const status = document.getElementById('statusSelect').value;

        if (search) currentUrl.searchParams.set('search', search);
        else currentUrl.searchParams.delete('search');

        if (dateFrom) currentUrl.searchParams.set('date_from', dateFrom);
        else currentUrl.searchParams.delete('date_from');

        if (dateTo) currentUrl.searchParams.set('date_to', dateTo);
        else currentUrl.searchParams.delete('date_to');

        if (status) currentUrl.searchParams.set('status', status);
        else currentUrl.searchParams.delete('status');

        window.history.replaceState({}, '', currentUrl);
        loadNews();
    };

    document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(updateUrlAndReload, 300);
    });

    ['dateFrom', 'dateTo', 'statusSelect'].forEach(id => {
        document.getElementById(id).addEventListener('change', updateUrlAndReload);
    });
});
</script>

</body>
</html>
