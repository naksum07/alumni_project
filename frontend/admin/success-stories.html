<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Success Stories | AlumniConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="../scripts/data-store.js"></script>
<script src="../scripts/popup.js"></script>
<script src="../scripts/admin-common.js"></script>
</head>
<body class="bg-slate-50 font-sans">

<div class="admin-content">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Success Stories Dashboard</h1>
            <p class="text-sm text-slate-500 mt-1">Review, approve, or reject alumni success story submissions before they appear on the homepage carousel.</p>
        </div>
        <div class="flex items-center gap-3 w-full md:w-auto">
            <input type="text" id="searchInput" placeholder="Search by title or author..." class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-64">
        </div>
    </div>

    <!-- Status Filters -->
    <div class="flex gap-2 mb-6 border-b border-slate-200 pb-3">
        <button onclick="filterStatus('')" class="status-tab text-sm font-medium px-4 py-2 rounded-lg bg-blue-900 text-white" data-status="">All Stories</button>
        <button onclick="filterStatus('pending')" class="status-tab text-sm font-medium px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 hover:bg-slate-50" data-status="pending">
            ⏳ Pending
        </button>
        <button onclick="filterStatus('approved')" class="status-tab text-sm font-medium px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 hover:bg-slate-50" data-status="approved">
            ✅ Approved
        </button>
        <button onclick="filterStatus('rejected')" class="status-tab text-sm font-medium px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 hover:bg-slate-50" data-status="rejected">
            ❌ Rejected
        </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
        <table class="admin-table" id="storiesTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Alumni Author</th>
                    <th>Story Title</th>
                    <th>Story Preview</th>
                    <th>Status</th>
                    <th class="text-right">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="text-center py-6 text-slate-400">Loading success stories...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- STORY PREVIEW MODAL -->
<div id="storyModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 border border-gray-200">
        <div class="flex items-center justify-between pb-3 border-b border-gray-200">
            <div>
                <span id="modalStatusBadge" class="text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">Pending</span>
                <h3 id="modalStoryTitle" class="text-xl font-bold text-gray-900 mt-2">Story Title</h3>
            </div>
            <button onclick="closeStoryModal()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none">&times;</button>
        </div>
        <div class="py-4 text-slate-700 text-sm leading-relaxed max-h-[60vh] overflow-y-auto whitespace-pre-line" id="modalStoryContent">
            Story content goes here...
        </div>
        <div class="pt-3 border-t border-gray-200 flex justify-between items-center text-xs text-slate-500">
            <span id="modalAuthorMeta">By Author</span>
            <div class="flex gap-2">
                <button id="modalApproveBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-lg transition text-xs">Approve</button>
                <button id="modalRejectBtn" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-4 py-2 rounded-lg transition text-xs">Reject</button>
                <button onclick="closeStoryModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg transition text-xs">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentStatusFilter = '';
let currentSearchQuery = '';
let allStoriesCache = [];

function getToken() {
    return typeof getAdminToken === 'function' ? getAdminToken() : (localStorage.getItem('adminToken') || localStorage.getItem('token'));
}

async function loadSuccessStories() {
    const tbody = document.querySelector('#storiesTable tbody');
    if (!tbody) return;

    try {
        let url = '/api/admin/success-stories?';
        if (currentStatusFilter) url += `status=${encodeURIComponent(currentStatusFilter)}&`;
        if (currentSearchQuery) url += `search=${encodeURIComponent(currentSearchQuery)}`;

        const res = await fetch(url, {
            headers: { 'Authorization': 'Bearer ' + getToken() }
        });

        if (!res.ok) {
            if (res.status === 401 || res.status === 403) {
                if (typeof clearAdminTokens === 'function') clearAdminTokens();
                return window.location.href = '/admin/login.html';
            }
            throw new Error('Failed to load success stories');
        }

        const stories = await res.json();
        allStoriesCache = stories;
        tbody.innerHTML = '';

        if (stories.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-slate-400">No success stories found.</td></tr>';
            return;
        }

        stories.forEach(story => {
            const dateStr = new Date(story.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            let statusBadge = '';
            if (story.status === 'approved') {
                statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">✅ Approved</span>';
            } else if (story.status === 'rejected') {
                statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-800 border border-rose-200">❌ Rejected</span>';
            } else {
                statusBadge = '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200">⏳ Pending</span>';
            }

            const authorInfo = `
                <div>
                    <span class="font-bold text-slate-800 block">${escapeHTML(story.author_name || 'Alumni')}</span>
                    <span class="text-xs text-slate-500 block">${escapeHTML(story.job_title || '')} ${story.company ? 'at ' + escapeHTML(story.company) : ''}</span>
                    <span class="text-[11px] text-slate-400 block">${escapeHTML(story.department || '')} ${story.graduation_year ? '(' + story.graduation_year + ')' : ''}</span>
                </div>
            `;

            const snippet = story.story_text.length > 90 ? escapeHTML(story.story_text.substring(0, 90)) + '...' : escapeHTML(story.story_text);

            tbody.innerHTML += `
                <tr class="hover:bg-slate-50 transition">
                    <td class="whitespace-nowrap text-xs text-slate-500 font-medium">${dateStr}</td>
                    <td>${authorInfo}</td>
                    <td class="font-semibold text-slate-800 max-w-[180px]">${escapeHTML(story.title)}</td>
                    <td class="text-slate-600 max-w-[280px]">
                        <p class="text-xs leading-relaxed">${snippet}</p>
                        <button onclick="viewFullStory(${story.id})" class="text-xs font-semibold text-blue-600 hover:underline mt-1 inline-block">Read full story ↗</button>
                    </td>
                    <td class="whitespace-nowrap">${statusBadge}</td>
                    <td class="whitespace-nowrap text-right space-x-1">
                        ${story.status !== 'approved' ? `
                            <button onclick="updateStatus(${story.id}, 'approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium shadow-sm transition" title="Approve">
                                Approve
                            </button>
                        ` : ''}
                        ${story.status !== 'rejected' ? `
                            <button onclick="updateStatus(${story.id}, 'rejected')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium shadow-sm transition" title="Reject">
                                Reject
                            </button>
                        ` : ''}
                        <button onclick="deleteStory(${story.id})" class="text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg transition" title="Delete">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
    } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-rose-500 font-medium">${err.message || 'Error loading stories'}</td></tr>`;
    }
}

function escapeHTML(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
}

function filterStatus(status) {
    currentStatusFilter = status;
    document.querySelectorAll('.status-tab').forEach(btn => {
        if (btn.getAttribute('data-status') === status) {
            btn.className = 'status-tab text-sm font-medium px-4 py-2 rounded-lg bg-blue-900 text-white';
        } else {
            btn.className = 'status-tab text-sm font-medium px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 hover:bg-slate-50';
        }
    });
    loadSuccessStories();
}

window.updateStatus = async function(id, newStatus) {
    const actionName = newStatus === 'approved' ? 'Approve' : 'Reject';
    showConfirmPopup(
        `Are you sure you want to set this success story status to ${newStatus}?`,
        `${actionName} Story`,
        async () => {
            try {
                const res = await fetch(`/api/admin/success-stories/${id}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + getToken()
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || `Failed to update status to ${newStatus}`);
                showPopup(`Success story status updated to ${newStatus}.`, 'success');
                closeStoryModal();
                loadSuccessStories();
            } catch (err) {
                showPopup(err.message || 'Error updating story status', 'error');
            }
        },
        null,
        actionName,
        'Cancel'
    );
};

window.deleteStory = async function(id) {
    showConfirmPopup(
        'Are you sure you want to delete this success story? This action cannot be undone.',
        'Delete Story',
        async () => {
            try {
                const res = await fetch(`/api/admin/success-stories/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + getToken() }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Failed to delete success story');
                showPopup('Success story deleted successfully.', 'success');
                closeStoryModal();
                loadSuccessStories();
            } catch (err) {
                showPopup(err.message || 'Error deleting story', 'error');
            }
        },
        null,
        'Delete',
        'Cancel'
    );
};

window.viewFullStory = function(id) {
    const story = allStoriesCache.find(s => Number(s.id) === Number(id));
    if (!story) return;

    document.getElementById('modalStoryTitle').textContent = story.title;
    document.getElementById('modalStoryContent').textContent = story.story_text;
    document.getElementById('modalAuthorMeta').textContent = `Submitted by ${story.author_name || 'Alumni'} (${story.author_email || ''})`;

    const badge = document.getElementById('modalStatusBadge');
    if (story.status === 'approved') {
        badge.className = 'text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider bg-emerald-100 text-emerald-800';
        badge.textContent = 'Approved';
    } else if (story.status === 'rejected') {
        badge.className = 'text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider bg-rose-100 text-rose-800';
        badge.textContent = 'Rejected';
    } else {
        badge.className = 'text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider bg-amber-100 text-amber-800';
        badge.textContent = 'Pending Approval';
    }

    const appBtn = document.getElementById('modalApproveBtn');
    const rejBtn = document.getElementById('modalRejectBtn');
    
    appBtn.onclick = () => updateStatus(story.id, 'approved');
    rejBtn.onclick = () => updateStatus(story.id, 'rejected');

    document.getElementById('storyModal').classList.remove('hidden');
};

function closeStoryModal() {
    document.getElementById('storyModal').classList.add('hidden');
}

document.addEventListener('DOMContentLoaded', () => {
    loadSuccessStories();

    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                currentSearchQuery = e.target.value.trim();
                loadSuccessStories();
            }, 300);
        });
    }
});
</script>

</body>
</html>
