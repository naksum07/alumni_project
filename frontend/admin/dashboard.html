<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | AlumniConnect</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
    <script src="../scripts/data-store.js" defer></script>
    <script src="../scripts/popup.js" defer></script>
    <script src="../scripts/admin-common.js" defer></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
     <style>
    html {
       scroll-behavior: smooth;
     }
    body { 
      overflow-x: hidden; 
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-10">
        <header class="mb-8 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-700">Overview</p>
                <h1 class="mt-2 text-3xl font-bold text-slate-900 md:text-4xl">Dashboard</h1>
            </div>

            <div class="inline-flex items-center gap-3 rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm font-semibold text-blue-700 shadow-sm">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Administrator</span>
            </div>
        </header>

            <section class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-5" id="statsGrid">
                <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Total Users</div>
                    <div class="mt-3 text-3xl font-bold text-slate-900">0</div>
                </div>
                <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Alumni</div>
                    <div class="mt-3 text-3xl font-bold text-slate-900">0</div>
                </div>
                <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Students</div>
                    <div class="mt-3 text-3xl font-bold text-slate-900">0</div>
                </div>
                <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Events Hosted</div>
                    <div class="mt-3 text-3xl font-bold text-slate-900">0</div>
                </div>
                <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Participants</div>
                    <div class="mt-3 text-3xl font-bold text-slate-900">0</div>
                </div>
            </section>

            <section class="mt-8 grid grid-cols-1 gap-6 xl:grid-cols-2">
                <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div class="mb-4 flex items-center justify-between gap-4">
                        <h2 class="text-xl font-bold text-slate-800">Participants by Event</h2>
                        <span class="rounded-full bg-blue-50 px-2.5 py-1 text-xs font-semibold text-blue-700">Live</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full text-left text-sm" id="eventsTable">
                            <thead>
                                <tr class="border-b border-slate-200 text-slate-600">
                                    <th class="pb-3 pr-4 font-semibold">Event Name</th>
                                    <th class="pb-3 pr-4 font-semibold">Host</th>
                                    <th class="pb-3 pr-4 font-semibold">Date</th>
                                    <th class="pb-3 pr-4 font-semibold">Status</th>
                                    <th class="pb-3 font-semibold">Participants</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>

                <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div class="mb-4 flex items-center justify-between gap-4">
                        <h2 class="text-xl font-bold text-slate-800">Recently Registered Members</h2>
                        <span class="rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-700">New</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full text-left text-sm" id="membersTable">
                            <thead>
                                <tr class="border-b border-slate-200 text-slate-600">
                                    <th class="pb-3 pr-4 font-semibold">Name</th>
                                    <th class="pb-3 pr-4 font-semibold">Type</th>
                                    <th class="pb-3 font-semibold">Date Joined</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = typeof getAdminToken === 'function' ? getAdminToken() : (localStorage.getItem('adminToken') || localStorage.getItem('token'));
            if (!token) return window.location.href = 'login.html';

            try {
                const res = await fetch('/api/admin/dashboard', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        if (typeof clearAdminTokens === 'function') clearAdminTokens();
                        return window.location.href = 'login.html';
                    }
                    throw new Error('Failed to load dashboard');
                }

                const data = await res.json();
                const userStats = data.userStats || {};
                const eventStats = data.eventStats || {};

                const cards = Array.from(document.querySelectorAll('#statsGrid > div'));
                const values = [
                    userStats.total || 0,
                    userStats.alumni || 0,
                    userStats.students || 0,
                    eventStats.totalEvents || 0,
                    eventStats.totalParticipants || 0
                ];

                cards.forEach((card, index) => {
                    const value = card.querySelector('div:last-child');
                    if (value) value.textContent = values[index];
                    const text = card.querySelector('div:first-child');
                    if (text) text.classList.add(index % 2 === 0 ? 'text-blue-700' : 'text-emerald-700');
                });

                const events = Array.isArray(data.events) ? data.events : [];
                const eBody = document.querySelector('#eventsTable tbody');
                if (eBody) {
                    eBody.innerHTML = events.length ? '' : '<tr><td colspan="5" class="py-4 text-center text-slate-400">No recent events found.</td></tr>';
                    events.slice(0, 5).forEach(e => {
                        const badgeColor = e.status === 'completed' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700';
                        eBody.innerHTML += `
                            <tr class="text-slate-700">
                                <td class="py-3 pr-4 font-medium text-slate-800">${e.title}</td>
                                <td class="py-3 pr-4">${e.host}</td>
                                <td class="py-3 pr-4">${e.date}</td>
                                <td class="py-3 pr-4"><span class="inline-flex rounded-full px-2.5 py-1 text-xs font-semibold ${badgeColor}">${e.status}</span></td>
                                <td class="py-3">${e.participantCount}</td>
                            </tr>
                        `;
                    });
                }

                const usersRes = await fetch('/api/admin/users', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (usersRes.ok) {
                    const usersData = await usersRes.json();
                    const mBody = document.querySelector('#membersTable tbody');
                    if (mBody && Array.isArray(usersData)) {
                        mBody.innerHTML = usersData.length ? '' : '<tr><td colspan="3" class="py-4 text-center text-slate-400">No members found.</td></tr>';
                        usersData.slice(0, 5).forEach(u => {
                            const badge = u.role === 'alumni' ? 'bg-violet-100 text-violet-700' : 'bg-orange-100 text-orange-700';
                            mBody.innerHTML += `
                                <tr class="text-slate-700">
                                    <td class="py-3 pr-4 font-medium text-slate-800">${u.full_name}</td>
                                    <td class="py-3 pr-4"><span class="inline-flex rounded-full px-2.5 py-1 text-xs font-semibold uppercase ${badge}">${u.role}</span></td>
                                    <td class="py-3">${u.created_at ? new Date(u.created_at).toLocaleDateString() : 'N/A'}</td>
                                </tr>
                            `;
                        });
                    }
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
