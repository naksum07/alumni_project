<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AlumniConnect</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; 
    }</style>
</head>

<body class="bg-gray-100 text-gray-800">

<main class="min-h-screen flex items-center justify-center pt-24 pb-12 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 mx-4">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="text-5xl">🎓</div>
      <h1 class="text-3xl font-bold text-blue-900 mt-3">AlumniConnect</h1>
    </div>

    <div id="formView" class="hidden">
      <h2 class="text-xl font-bold text-gray-800 mb-1">Reset your password</h2>
      <p class="text-gray-500 text-sm mb-6">
        Choose a new password for your account.
      </p>

      <p id="formMessage" class="text-center text-sm font-medium mb-4 hidden"></p>

      <form id="resetForm" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-semibold mb-2">New Password</label>
          <input
            type="password"
            id="newPassword"
            required
            minlength="6"
            placeholder="Enter new password"
            class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-900">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            required
            minlength="6"
            placeholder="Confirm new password"
            class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-900">
        </div>
        <button
          type="submit"
          id="resetBtn"
          class="w-full bg-blue-900 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">
          Reset Password
        </button>
      </form>
    </div>

    <!-- ====================================================
         INVALID VIEW — no token, or token rejected by server
    ==================================================== -->
    <div id="invalidView" class="hidden text-center">
      <div class="text-5xl mb-4">⚠️</div>
      <h2 class="text-xl font-bold text-gray-800 mb-2">Link expired or invalid</h2>
      <p class="text-gray-500 text-sm mb-6">
        This password reset link is no longer valid. Reset links expire after a short
        time and can only be used once.
      </p>
      <a href="forgot-password.html"
         class="block w-full bg-blue-900 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">
        Request a new link
      </a>
    </div>

    <!-- Back to login -->
    <a href="login.html" class="block text-center mt-6 text-gray-500 hover:text-blue-900 transition">
      ← Back to Login
    </a>

  </div>
</main>

<script>
const formView    = document.getElementById('formView');
const invalidView = document.getElementById('invalidView');
const formMsg     = document.getElementById('formMessage');

function showMsg(el, text, isError) {
  el.textContent = text;
  el.classList.remove('hidden', 'text-red-600', 'text-green-600');
  el.classList.add(isError ? 'text-red-600' : 'text-green-600');
}

const params = new URLSearchParams(window.location.search);
const token  = params.get('token');

if (!token) {
  invalidView.classList.remove('hidden');
} else {
  formView.classList.remove('hidden');
}

document.getElementById('resetForm').addEventListener('submit', async function (e) {
  e.preventDefault();

  const newPassword = document.getElementById('newPassword').value;
  const confirm      = document.getElementById('confirmPassword').value;
  const btn          = document.getElementById('resetBtn');

  if (newPassword !== confirm) {
    showMsg(formMsg, 'Passwords do not match.', true);
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Resetting…';

  try {
    const res  = await fetch('/api/auth/reset-password', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token, newPassword }),
    });
    const data = await res.json();

    if (!res.ok) {
      formView.classList.add('hidden');
      invalidView.classList.remove('hidden');
      return;
    }

    showMsg(formMsg, '✅ Password reset successfully! Redirecting to login…', false);
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);

  } catch (err) {
    console.error(err);
    showMsg(formMsg, 'Could not reach the server. Please try again.', true);
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Reset Password';
  }
});
</script>

</body>
</html>
