<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AlumniConnect</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="../scripts/popup.js" defer></script>
  <script src="../scripts/reset-password.js" defer></script>

  <style>
    html { 
      scroll-behavior: smooth; 
    }
  </style>
</head>

<body class="bg-slate-50 text-gray-800">

<main class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-10 mx-4">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 mb-3">
        <span class="p-1 flex items-center">
          <img src="../assets/logo.png" alt="ICFAI University Sikkim" class="h-12 w-auto">
        </span>
      </a>
      <h1 class="text-2xl font-bold text-[#012970]">Alumni<span class="text-[#c4161c]">Connect</span></h1>
    </div>

    <div id="formView" class="hidden">
      <h2 class="text-xl font-bold text-slate-800 mb-1">Reset your password</h2>
      <p class="text-slate-500 text-sm mb-6">
        Choose a new password for your account.
      </p>

      <p id="formMessage" class="text-center text-sm font-medium mb-4 hidden"></p>

      <form id="resetForm" class="space-y-4">
        <div>
          <label class="block text-slate-700 font-semibold mb-1.5 text-xs uppercase tracking-wide">New Password (min 8 chars)</label>
          <div class="relative">
            <input
              type="password"
              id="newPassword"
              required
              minlength="8"
              placeholder="Enter new password"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 pr-11 text-sm focus:outline-none focus:ring-2 focus:ring-[#012970]/30 focus:border-[#012970]">
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1" onclick="togglePasswordVisibility('newPassword', this)" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-slate-700 font-semibold mb-1.5 text-xs uppercase tracking-wide">Confirm Password</label>
          <div class="relative">
            <input
              type="password"
              id="confirmPassword"
              required
              minlength="8"
              placeholder="Confirm new password"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 pr-11 text-sm focus:outline-none focus:ring-2 focus:ring-[#012970]/30 focus:border-[#012970]">
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="resetBtn"
          class="w-full bg-[#c4161c] hover:bg-[#a01217] text-white py-3.5 rounded-xl font-semibold transition shadow-md">
          Reset Password
        </button>
      </form>
    </div>

    <!-- INVALID VIEW -->
    <div id="invalidView" class="hidden text-center">
      <div class="text-5xl mb-4">⚠️</div>
      <h2 class="text-xl font-bold text-slate-800 mb-2">Link expired or invalid</h2>
      <p class="text-slate-500 text-sm mb-6">
        This password reset link is no longer valid. Reset links expire after a short
        time and can only be used once.
      </p>
      <a href="forgot-password.html"
         class="block w-full bg-[#c4161c] hover:bg-[#a01217] text-white py-3.5 rounded-xl font-semibold transition shadow-md">
        Request a new link
      </a>
    </div>

    <!-- Back to login -->
    <a href="login.html" class="block text-center mt-6 text-sm text-slate-500 hover:text-[#012970] transition">
      ← Back to Login
    </a>

  </div>
</main>
</body>
</html>
