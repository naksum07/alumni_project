<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | AlumniConnect</title>
<meta name="description" content="Login to AlumniConnect alumni portal and connect with your alumni community.">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    html { 
        scroll-behavior: smooth; 
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-7px); }
        40%, 80% { transform: translateX(7px); }
    }
    .shake-card {
        animation: shake 0.4s ease-in-out;
    }
    .input-error {
        border-color: #ef4444 !important;
        background-color: #fef2f2 !important;
    }
    .input-error:focus {
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25) !important;
    }
</style>
</head>
<body class="bg-slate-50 text-gray-800">

<!-- MAIN CONTENT -->
<main class="min-h-screen flex items-center justify-center py-12 px-4">

<!-- LOGIN CONTAINER -->
<div id="loginCard" class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-10 mx-4 transition-all">

<!-- LOGO -->
<div class="text-center mb-8">
    <a href="index.html" class="inline-flex items-center gap-2 mb-3">
        <span class="p-1 flex items-center">
            <img src="../assets/logo.png" alt="ICFAI University Sikkim" class="h-12 w-auto">
        </span>
    </a>
    <h1 class="text-3xl font-bold text-[#012970]">Welcome <span class="text-[#c4161c]">Back</span></h1>
    <p class="text-slate-500 mt-1 text-sm">Login to your ICFAI University Sikkim portal</p>
</div>

<!-- ENHANCED ALERT BANNER -->
<div id="formAlert" class="hidden mb-6 rounded-2xl p-4 text-sm transition-all duration-300 border shadow-sm flex items-start gap-3">
    <div id="alertIconContainer" class="p-2.5 rounded-xl shrink-0 flex items-center justify-center">
        <i id="alertIcon" class="fa-solid fa-circle-exclamation text-lg"></i>
    </div>
    <div class="flex-1 pt-0.5">
        <h4 id="alertTitle" class="font-bold text-xs uppercase tracking-wider mb-0.5"></h4>
        <p id="alertMessage" class="text-sm leading-snug"></p>
        <div id="alertAction" class="mt-2 text-xs hidden"></div>
    </div>
</div>

<!-- FORM -->
<form id="loginForm" novalidate>

<!-- EMAIL -->
<div class="mb-5">
    <div class="flex justify-between items-center mb-1.5">
        <label class="block text-slate-700 font-semibold text-xs uppercase tracking-wide">Email Address</label>
        <span id="emailError" class="text-xs font-medium text-red-600 hidden"></span>
    </div>
    <input type="email"
        id="email"
        placeholder="Enter your email address" required
        class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#012970]/30 focus:border-[#012970] transition-colors">
</div>

<!-- PASSWORD -->
<div class="mb-5">
    <div class="flex justify-between items-center mb-1.5">
        <label class="block text-slate-700 font-semibold text-xs uppercase tracking-wide">Password</label>
        <span id="passwordError" class="text-xs font-medium text-red-600 hidden"></span>
    </div>
    <div class="relative">
        <input type="password"
            id="password"
            placeholder="Enter password" required
            class="w-full border border-gray-300 rounded-xl px-4 py-3 pr-11 text-sm focus:outline-none focus:ring-2 focus:ring-[#012970]/30 focus:border-[#012970] transition-colors">
        <button type="button"
            id="toggleButton"
            onclick="togglePasswordVisibility('password', this)"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1"
            aria-label="Toggle password visibility">
            <i class="fa-solid fa-eye"></i>
        </button>
    </div>
</div>

<!-- OPTIONS -->
<div class="flex justify-between items-center mb-6 text-sm">
    <label class="flex items-center gap-2 text-slate-600 cursor-pointer select-none">
        <input type="checkbox" class="rounded text-[#c4161c] focus:ring-[#c4161c]">Remember me
    </label>
    <a href="forgot-password.html" class="text-[#012970] hover:text-[#c4161c] hover:underline font-semibold">Forgot Password?</a>
</div>

<!-- LOGIN BUTTON -->
<button type="submit"
    id="loginSubmitBtn"
    class="w-full bg-[#c4161c] hover:bg-[#a01217] text-white py-3.5 rounded-xl font-semibold transition-all duration-200 shadow-md flex items-center justify-center gap-2">
    <span>Login</span>
</button>
</form>

<!-- REGISTER -->
<p class="text-center text-slate-600 mt-6 text-sm">
    Don't have an account?
    <a href="register.html" class="text-[#012970] font-semibold hover:text-[#c4161c] underline">Create Account</a>
</p>

<!-- BACK HOME -->
<a href="index.html" class="block text-center mt-3 text-xs text-slate-400 hover:text-[#012970]">Back to Home</a>

</div>

</main>

<script>
// SHOW / HIDE PASSWORD
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const icon = btn.querySelector('i');
    if (input.type === "password") {
        input.type = "text";
        if (icon) {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    } else {
        input.type = "password";
        if (icon) {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
}

const loginCard = document.getElementById("loginCard");
const loginForm = document.getElementById("loginForm");
const formAlert = document.getElementById("formAlert");
const alertIconContainer = document.getElementById("alertIconContainer");
const alertIcon = document.getElementById("alertIcon");
const alertTitle = document.getElementById("alertTitle");
const alertMessage = document.getElementById("alertMessage");
const alertAction = document.getElementById("alertAction");
const loginBtn = document.getElementById("loginSubmitBtn");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const emailError = document.getElementById("emailError");
const passwordError = document.getElementById("passwordError");

// Clear field errors on user input
[emailInput, passwordInput].forEach(input => {
    input.addEventListener('input', () => {
        input.classList.remove('input-error');
        if (input.id === 'email') emailError.classList.add('hidden');
        if (input.id === 'password') passwordError.classList.add('hidden');
    });
});

function showAlert(text, type = 'error', actionHtml = '') {
    const formAlert = document.getElementById("formAlert");
    const alertIconContainer = document.getElementById("alertIconContainer");
    const alertIcon = document.getElementById("alertIcon");
    const alertTitle = document.getElementById("alertTitle");
    const alertMessage = document.getElementById("alertMessage");
    const alertAction = document.getElementById("alertAction");

    if (!formAlert) return;

    formAlert.classList.remove("hidden", "bg-red-50", "border-red-200", "text-red-900", "bg-amber-50", "border-amber-200", "text-amber-900", "bg-emerald-50", "border-emerald-200", "text-emerald-900", "bg-blue-50", "border-blue-200", "text-blue-900");
    alertIconContainer.classList.remove("bg-red-100", "text-red-600", "bg-amber-100", "text-amber-700", "bg-emerald-100", "text-emerald-600", "bg-blue-100", "text-blue-600");
    alertIcon.className = '';

    if (type === 'error') {
        formAlert.classList.add("bg-red-50", "border-red-200", "text-red-900");
        alertIconContainer.classList.add("bg-red-100", "text-red-600");
        alertIcon.className = "fa-solid fa-circle-xmark text-lg";
        alertTitle.textContent = "Authentication Error";
    } else if (type === 'warning') {
        formAlert.classList.add("bg-amber-50", "border-amber-200", "text-amber-900");
        alertIconContainer.classList.add("bg-amber-100", "text-amber-700");
        alertIcon.className = "fa-solid fa-user-shield text-lg";
        alertTitle.textContent = "Account Notice";
    } else if (type === 'network') {
        formAlert.classList.add("bg-rose-50", "border-rose-200", "text-rose-900");
        alertIconContainer.classList.add("bg-rose-100", "text-rose-600");
        alertIcon.className = "fa-solid fa-wifi text-lg";
        alertTitle.textContent = "Connection Error";
    } else if (type === 'success') {
        formAlert.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-900");
        alertIconContainer.classList.add("bg-emerald-100", "text-emerald-600");
        alertIcon.className = "fa-solid fa-circle-check text-lg";
        alertTitle.textContent = "Success";
    }

    alertMessage.textContent = text;

    if (actionHtml) {
        alertAction.innerHTML = actionHtml;
        alertAction.classList.remove('hidden');
    } else {
        alertAction.classList.add('hidden');
    }

    formAlert.classList.remove("hidden");
}

function triggerShake() {
    loginCard.classList.remove("shake-card");
    void loginCard.offsetWidth; // Force reflow
    loginCard.classList.add("shake-card");
}

function getApiUrl(endpoint) {
    const origin = window.location.origin;
    if (window.location.protocol === 'file:' || (origin && !origin.endsWith(':5001'))) {
        return `http://localhost:5001${endpoint.startsWith('/') ? endpoint : '/' + endpoint}`;
    }
    return endpoint;
}

// LOGIN — CALLS THE BACKEND API
loginForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    let hasValidationError = false;

    if (!email) {
        emailInput.classList.add('input-error');
        emailError.textContent = "Email is required";
        emailError.classList.remove('hidden');
        hasValidationError = true;
    }

    if (!password) {
        passwordInput.classList.add('input-error');
        passwordError.textContent = "Password is required";
        passwordError.classList.remove('hidden');
        hasValidationError = true;
    }

    if (hasValidationError) {
        triggerShake();
        showAlert("Please fill in both your email address and password.", 'error');
        return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Logging in...</span>`;

    try {
        const response = await fetch(getApiUrl("/api/auth/login"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
            triggerShake();
            emailInput.classList.add('input-error');
            passwordInput.classList.add('input-error');

            const msg = data.message || "Login failed. Please check your credentials.";
            
            if (response.status === 401) {
                showAlert(msg, 'error', `Forgot password? <a href="forgot-password.html" class="underline font-bold hover:text-red-700">Reset it here</a>`);
            } else if (response.status === 403) {
                showAlert(msg, 'warning', `Need help? Contact support or <a href="feedback.html" class="underline font-bold hover:text-amber-800">send feedback</a>.`);
            } else {
                showAlert(msg, 'error');
            }
            return;
        }

        // Clear error states on success
        emailInput.classList.remove('input-error');
        passwordInput.classList.remove('input-error');

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        showAlert("Login successful! Redirecting to your dashboard...", 'success');
        setTimeout(() => {
            const returnTo = sessionStorage.getItem('returnTo') || 'index.html';
            sessionStorage.removeItem('returnTo');
            window.location.href = returnTo;
        }, 800);
    } catch (err) {
        console.error(err);
        triggerShake();
        showAlert("Could not connect to the backend server. Please verify your connection or try again shortly.", 'network');
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<span>Login</span>`;
    }
});
</script>
</body>
</html>
