<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | AlumniConnect</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/scripts/forgot-password.js" defer></script>
<style>
  html { 
    scroll-behavior: smooth; 
    }
</style>
</head>

<body class="bg-gray-100 text-gray-800">

<main class="min-h-screen flex items-center justify-center pt-24 pb-12 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 mx-4">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="text-5xl">🎓</div>
      <h1 class="text-3xl font-bold text-blue-900 mt-3">AlumniConnect</h1>
    </div>

    <div id="requestView">
      <h2 class="text-xl font-bold text-gray-800 mb-1">Forgot your password?</h2>
      <p class="text-gray-500 text-sm mb-6">
        Enter your registered email address and we'll send you a link to reset your password.
      </p>

      <p id="requestMessage" class="text-center text-sm font-medium mb-4 hidden"></p>

      <form id="forgotForm">
        <div class="mb-5">
          <label class="block text-gray-700 font-semibold mb-2">Email Address</label>
          <input
            type="email"
            id="forgotEmail"
            required
            placeholder="Enter your email address"
            class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-900">
        </div>
        <button
          type="submit"
          id="forgotBtn"
          class="w-full bg-blue-900 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">
          Send Reset Link
        </button>
      </form>
    </div>

    <div id="sentView" class="hidden text-center">
      <div class="text-5xl mb-4">📬</div>
      <h2 class="text-xl font-bold text-gray-800 mb-2">Check your email</h2>
      <p class="text-gray-500 text-sm mb-6">
        If an account exists for that address, we've sent a link to reset your password.
        The link will expire shortly for security reasons.
      </p>

      <button
        id="resendBtn"
        class="w-full bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition">
        Didn't get it? Send again
      </button>
    </div>

    <!-- Back to login -->
    <a href="login.html" class="block text-center mt-6 text-gray-500 hover:text-blue-900 transition">
       Back to Login
    </a>

  </div>
</main>
</body>
</html>
