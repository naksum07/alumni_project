<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | AlumniConnect</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="../scripts/forgot-password.js" defer></script>
<style>
  html { 
    scroll-behavior: smooth; 
  }
</style>
</head>

<body class="bg-slate-50 text-gray-800">

<main class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-10 mx-4">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 mb-3">
        <span class="p-1 flex items-center">
          <img src="../assets/logo.png" alt="ICFAI University Sikkim" class="h-12 w-auto">
        </span>
      </a>
      <h1 class="text-2xl font-bold text-[#012970]">Alumni<span class="text-[#c4161c]">Connect</span></h1>
    </div>

    <div id="requestView">
      <h2 class="text-xl font-bold text-slate-800 mb-1">Forgot your password?</h2>
      <p class="text-slate-500 text-sm mb-6">
        Enter your registered email address and we'll send you a link to reset your password.
      </p>

      <p id="requestMessage" class="text-center text-sm font-medium mb-4 hidden"></p>

      <form id="forgotForm" class="space-y-4">
        <div>
          <label class="block text-slate-700 font-semibold mb-1.5 text-xs uppercase tracking-wide">Email Address</label>
          <input
            type="email"
            id="forgotEmail"
            required
            placeholder="Enter your email address"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#012970]/30 focus:border-[#012970]">
        </div>
        <button
          type="submit"
          id="forgotBtn"
          class="w-full bg-[#c4161c] hover:bg-[#a01217] text-white py-3.5 rounded-xl font-semibold transition shadow-md">
          Send Reset Link
        </button>
      </form>
    </div>

    <div id="sentView" class="hidden text-center">
      <div class="text-5xl mb-4">📬</div>
      <h2 class="text-xl font-bold text-slate-800 mb-2">Check your email</h2>
      <p class="text-slate-500 text-sm mb-6">
        If an account exists for that address, we've sent a link to reset your password.
      </p>
      <div id="devLinkBox" class="hidden mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-left">
        <p class="font-bold text-amber-800 mb-1">🛠️ Development Reset Link:</p>
        <a id="devLinkAnchor" href="#" class="text-blue-600 underline break-all"></a>
      </div>

      <button
        id="resendBtn"
        class="w-full mt-4 bg-slate-100 text-slate-700 py-3 rounded-xl font-semibold hover:bg-slate-200 transition text-sm">
        Didn't get it? Send again
      </button>
    </div>

    <!-- Back to login -->
    <a href="login.html" class="block text-center mt-6 text-sm text-slate-500 hover:text-[#012970] transition">
       ← Back to Login
    </a>

  </div>
</main>
</body>
</html>
