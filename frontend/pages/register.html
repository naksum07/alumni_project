<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | AlumniConnect</title>
<meta name="description" content="Create your AlumniConnect account and join the alumni community.">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
    html { scroll-behavior: smooth; }
</style>
</head>
<body class="bg-gray-100 text-gray-800">
<!-- MAIN CONTENT -->
<main class="min-h-screen flex items-center justify-center pt-24 pb-12 px-4">

<div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8 mx-4">
    <div class="text-center mb-8">
    <div class="text-5xl">🎓</div>
        <h1 class="text-3xl font-bold text-blue-900 mt-3">AlumniConnect</h1>
        <p class="text-gray-500 mt-2">Create your alumni account</p>
    </div>

<!-- REGISTER FORM -->
<form id="registerForm" class="grid md:grid-cols-2 gap-5">

<p id="formMessage" class="md:col-span-2 text-center text-sm font-medium hidden"></p>

<!-- FULL NAME -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Full Name</label>
    <input type="text"
        id="fullName"
        placeholder="Enter your name" required
        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
</div>

<!-- EMAIL -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Email Address</label>
    <input type="email"
        id="email"
        placeholder="Enter email" required
        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
    </div>

<!-- PHONE -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Phone Number</label>
    <input type="tel"
    id="phone"
    placeholder="+91 XXXXX XXXXX"
    required
    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
</div>

<!-- ROLE -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Account Type</label>
    <select id="role" required class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
        <option value="" selected disabled>Select Role</option>
        <option value="student">Student</option>
        <option value="alumni">Alumni</option>
    </select>
</div>

<!-- DEPARTMENT -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Department</label>
    <select id="department" required class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
        <option value="" selected disabled>Select Department</option>
        <option value="Computer Science Engineering">Computer Science Engineering</option>
        <option value="Electronics Engineering">Electronics Engineering</option>
        <option value="Mechanical Engineering">Mechanical Engineering</option>
        <option value="Electrical Engineering">Electrical Engineering</option>
        <option value="Civil Engineering">Civil Engineering</option>
    </select>
</div>

<!-- PASSING YEAR -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Graduation Year</label>
    <select id="graduationYear" required class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
        <option value="" selected disabled>Select Year</option>
        <option value="2018">2018</option>
        <option value="2019">2019</option>
        <option value="2020">2020</option>
        <option value="2021">2021</option>
        <option value="2022">2022</option>
        <option value="2023">2023</option>
        <option value="2024">2024</option>
        <option value="2025">2025</option>
        <option value="2026">2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
    </select>
</div>

<!-- PASSWORD -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Password</label>
        <input id="password"
            type="password"
            placeholder="Create password" required
            class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
</div>

<!-- CONFIRM PASSWORD -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Confirm Password</label>
    <input id="confirmPassword"
        type="password"
        placeholder="Confirm password" required
        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
</div>

<!-- TERMS -->
<div class="md:col-span-2">
    <label class="flex items-center gap-2 text-gray-600">
    <input type="checkbox" required>I agree to Terms &amp; Conditions</label>
</div>

<!-- BUTTON -->
<div class="md:col-span-2">
    <button type="submit"
    class="w-full bg-blue-900 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">
        Create Account
    </button>
</div>
</form>
<!-- LOGIN LINK -->
<p class="text-center mt-6 text-gray-600">Already have an account?
    <a href="login.html" class="text-blue-900 font-semibold hover:underline">Login</a>
</p>
    <a href="index.html" class="block text-center mt-4 text-gray-500 hover:text-blue-900">Back to Home</a>

</div>

</main>

<script>
const registerForm = document.getElementById("registerForm");
const formMessage = document.getElementById("formMessage");
const submitBtn = registerForm.querySelector("button[type=submit]");

function showMessage(text, isError) {
    formMessage.textContent = text;
    formMessage.classList.remove("hidden", "text-red-600", "text-green-600");
    formMessage.classList.add(isError ? "text-red-600" : "text-green-600");
}

registerForm.addEventListener("submit", async function (e) {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const role = document.getElementById("role").value;
    const department = document.getElementById("department").value;
    const graduationYear = document.getElementById("graduationYear").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        showMessage("Passwords do not match", true);
        return;
    }

    submitBtn.disabled = true;
    const originalBtnText = submitBtn.textContent;
    submitBtn.textContent = "Creating Account...";

    try {
        const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                fullName,
                email,
                phone,
                password,
                role,
                department,
                graduationYear: graduationYear ? Number(graduationYear) : null,
            }),
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage(data.message || "Registration failed. Please try again.", true);
            return;
        }

        showMessage("Registration successful! Redirecting to login...", false);
        setTimeout(() => {
            window.location.href = "login.html";
        }, 1200);
    } catch (err) {
        console.error(err);
        showMessage("Could not reach the server. Please try again later.", true);
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnText;
    }
});
</script>
</body>
</html>
