<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | AlumniConnect</title>

<meta name="description" content="Login to AlumniConnect alumni portal.">

<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 pt-28 min-h-screen flex flex-col">



<!-- ================= FIXED HEADER ================= -->

<header class="fixed top-0 left-0 w-full bg-gradient-to-r from-blue-900 to-blue-600 text-white shadow-lg z-50">


<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">


<h2 class="text-2xl font-bold">
🎓 AlumniConnect
</h2>


<nav class="hidden md:block space-x-6">


<a href="index.html" class="hover:text-yellow-300">
Home
</a>


<a href="register.html" class="hover:text-yellow-300">
Register
</a>


<a href="events.html" class="hover:text-yellow-300">
Events
</a>


<a href="alumni-list.html" class="hover:text-yellow-300">
Search Alumni
</a>


</nav>


</div>


</header>







<!-- ================= LOGIN AREA ================= -->


<main class="flex-grow flex items-center justify-center">


<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 mx-4">



<div class="text-center mb-8">


<div class="text-5xl">
🎓
</div>


<h1 class="text-3xl font-bold text-blue-900 mt-3">
AlumniConnect
</h1>


<p class="text-gray-500 mt-2">
Login to your alumni account
</p>


</div>







<form id="loginForm">





<!-- EMAIL -->

<div class="mb-5">


<label class="block text-gray-700 font-semibold mb-2">
Email Address
</label>


<input

type="email"

id="email"

placeholder="Enter your email"

required

class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-900">


</div>







<!-- PASSWORD -->


<div class="mb-5">


<label class="block text-gray-700 font-semibold mb-2">
Password
</label>


<div class="relative">


<input

type="password"

id="password"

placeholder="Enter password"

required

class="w-full border rounded-lg px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-900">


<button

type="button"

onclick="togglePassword()"

class="absolute right-3 top-3 text-gray-500">


👁


</button>


</div>


</div>






<!-- OPTIONS -->


<div class="flex justify-between items-center mb-6">


<label class="flex items-center gap-2 text-gray-600">


<input type="checkbox">


Remember me


</label>



<a href="forgot-password.html"

class="text-blue-900 hover:underline">


Forgot Password?


</a>


</div>

<!-- LOGIN BUTTON -->

<button

type="submit"

class="w-full bg-blue-900 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">


Login


</button>



</form>







<!-- DIVIDER -->


<div class="flex items-center my-6">


<div class="flex-1 h-px bg-gray-300"></div>


<span class="px-3 text-gray-500">
OR
</span>


<div class="flex-1 h-px bg-gray-300"></div>


</div>








<!-- SOCIAL LOGIN -->


<button

class="w-full border py-3 rounded-lg mb-3 hover:bg-gray-100 transition">


🔵 Continue with Google


</button>





<button

class="w-full border py-3 rounded-lg hover:bg-gray-100 transition">


💼 Continue with LinkedIn


</button>








<!-- REGISTER -->


<p class="text-center text-gray-600 mt-6">


Don't have an account?


<a href="register.html"

class="text-blue-900 font-semibold hover:underline">


Create Account


</a>


</p>








<!-- PREVIOUS PAGE -->


<a href="javascript:history.back()"

class="block text-center mt-5 text-gray-500 hover:text-blue-900">


← Previous Page


</a>






</div>


</main>








<!-- ================= NORMAL FOOTER ================= -->


<footer class="bg-gray-900 text-white text-center py-5 mt-auto">


<p class="font-semibold text-lg">
🎓 AlumniConnect
</p>


<p class="text-sm mt-2">
Email: support@alumniconnect.com | Phone: +91 98765 43210
</p>


<p class="text-xs mt-2">
© 2026 AlumniConnect | All Rights Reserved
</p>


</footer>








<script>


// SHOW / HIDE PASSWORD


function togglePassword(){


let password=document.getElementById("password");


if(password.type==="password"){


password.type="text";


}

else{


password.type="password";


}


}







// LOGIN VALIDATION


document.getElementById("loginForm")

.addEventListener("submit",function(event){


event.preventDefault();



let email=document.getElementById("email").value;

let password=document.getElementById("password").value;




if(email==="" || password===""){


alert("Please fill all fields");


return;


}





if(password.length < 8){


alert("Password must contain at least 8 characters");


return;


}





alert("Login successful!");


// Connect backend/database here later


});



</script>





</body>

</html>
