<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | AlumniConnect</title>


<meta name="description" content="Login to AlumniConnect alumni portal and connect with your alumni community.">


<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">


<script src="https://cdn.tailwindcss.com"></script>


</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center">



<!-- LOGIN CONTAINER -->


<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 mx-4">



<!-- LOGO -->


<div class="text-center mb-8">


<div class="text-5xl">
🎓
</div>


<h1 class="text-3xl font-bold text-blue-900 mt-3">
AlumniConnect
</h1>


<p class="text-gray-500 mt-2">
Login to your alumni account
</p>


</div>





<!-- FORM -->


<form id="loginForm">



<!-- EMAIL -->


<div class="mb-5">


<label class="block text-gray-700 font-semibold mb-2">

Email Address

</label>


<input

type="email"

id="email"

placeholder="Enter your email"

required

class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-900">


</div>





<!-- PASSWORD -->


<div class="mb-5">


<label class="block text-gray-700 font-semibold mb-2">

Password

</label>



<div class="relative">


<input

type="password"

id="password"

placeholder="Enter password"

required

class="w-full border rounded-lg px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-900">



<button

type="button"

onclick="togglePassword()"

class="absolute right-3 top-3 text-gray-500">


👁

</button>


</div>


</div>








<!-- OPTIONS -->


<div class="flex justify-between items-center mb-6">



<label class="flex items-center gap-2 text-gray-600">


<input type="checkbox">


Remember me


</label>




<a href="forgot-password.html"

class="text-blue-900 hover:underline">


Forgot Password?


</a>



</div>








<!-- LOGIN BUTTON -->


<button

type="submit"

class="w-full bg-blue-900 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">


Login

</button>





</form>







<!-- DIVIDER -->


<div class="flex items-center my-6">


<div class="flex-1 h-px bg-gray-300"></div>


<span class="px-3 text-gray-500">

OR

</span>


<div class="flex-1 h-px bg-gray-300"></div>


</div>







<!-- SOCIAL LOGIN -->


<button

class="w-full border py-3 rounded-lg mb-3 hover:bg-gray-100 transition">


🔵 Continue with Google


</button>





<button

class="w-full border py-3 rounded-lg hover:bg-gray-100 transition">


💼 Continue with LinkedIn


</button>







<!-- REGISTER -->


<p class="text-center text-gray-600 mt-6">


Don't have an account?


<a href="register.html"

class="text-blue-900 font-semibold hover:underline">

Create Account

</a>


</p>







<!-- BACK HOME -->


<a href="index.html"

class="block text-center mt-5 text-gray-500 hover:text-blue-900">


← Back to Home


</a>




</div>









<script>


// SHOW / HIDE PASSWORD


function togglePassword(){


let password=document.getElementById("password");


if(password.type==="password"){


password.type="text";


}

else{


password.type="password";


}


}






// BASIC FORM VALIDATION


document.getElementById("loginForm")

.addEventListener("submit",function(event){


event.preventDefault();



let email=document.getElementById("email").value;

let password=document.getElementById("password").value;




if(email==="" || password===""){


alert("Please fill all fields");


return;


}



alert("Login successful!");



// Later connect backend API here



});



</script>



</body>

</html>
