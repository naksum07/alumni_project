<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | AlumniConnect</title>

<meta name="description" content="Create your AlumniConnect account.">

<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 pt-28">



<!-- ================= HEADER ================= -->


<header class="fixed top-0 left-0 w-full bg-gradient-to-r from-blue-900 to-blue-600 text-white shadow-lg z-50">


<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">


<h2 class="text-2xl font-bold">
🎓 AlumniConnect
</h2>


<nav class="hidden md:block space-x-6">


<a href="index.html" class="hover:text-yellow-300">
Home
</a>


<a href="events.html" class="hover:text-yellow-300">
Events
</a>


<a href="login.html" class="hover:text-yellow-300">
Login
</a>


</nav>


</div>


</header>









<!-- ================= REGISTER CARD ================= -->


<div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8 mx-auto">






<div class="text-center mb-8">


<div class="text-5xl">
🎓
</div>


<h1 class="text-3xl font-bold text-blue-900 mt-3">
AlumniConnect
</h1>


<p class="text-gray-500 mt-2">
Create your alumni account
</p>


</div>








<form id="registerForm" class="grid md:grid-cols-2 gap-5">





<!-- NAME -->


<div>


<label class="block font-semibold text-gray-700 mb-2">
Full Name
</label>


<input

type="text"

placeholder="Enter your name"

required

class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">


</div>







<!-- EMAIL -->


<div>


<label class="block font-semibold text-gray-700 mb-2">
Email Address
</label>


<input

type="email"

placeholder="Enter email"

required

class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">


</div>







<!-- PHONE -->


<div>


<label class="block font-semibold text-gray-700 mb-2">
Phone Number
</label>


<input

type="tel"

placeholder="+91 XXXXX XXXXX"

required

class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">


</div>







<!-- ROLE -->


<div>


<label class="block font-semibold text-gray-700 mb-2">
Account Type
</label>


<select class="w-full border rounded-lg px-4 py-3">


<option>Select Role</option>

<option>Student</option>

<option>Alumni</option>

<option>Teacher</option>


</select>


</div>







<!-- DEPARTMENT -->


<div>


<label class="block font-semibold text-gray-700 mb-2">
Department
</label>


<select class="w-full border rounded-lg px-4 py-3">


<option>Select Department</option>

<option>Computer Science Engineering</option>

<option>Electronics Engineering</option>

<option>Mechanical Engineering</option>

<option>Electrical Engineering</option>

<option>Civil Engineering</option>


</select>


</div>







<!-- YEAR -->


<div>


<label class="block font-semibold text-gray-700 mb-2">
Graduation Year
</label>


<select class="w-full border rounded-lg px-4 py-3">


<option>Select Year</option>

<option>2022</option>

<option>2023</option>

<option>2024</option>

<option>2025</option>

<option>2026</option>


</select>


</div>







<!-- PASSWORD -->


<div>


<label class="block font-semibold text-gray-700 mb-2">
Password
</label>


<input

id="password"

type="password"

placeholder="Create password"

required

class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">


<p id="strength" class="text-sm mt-2 font-semibold"></p>


</div>








<!-- CONFIRM PASSWORD -->


<div>


<label class="block font-semibold text-gray-700 mb-2">
Confirm Password
</label>


<input

id="confirmPassword"

type="password"

placeholder="Confirm password"

required

class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">


</div>







<!-- TERMS -->


<div class="md:col-span-2">


<label class="flex gap-2 text-gray-600">


<input type="checkbox" required>


I agree to Terms & Conditions


</label>


</div>







<!-- BUTTON -->


<div class="md:col-span-2">


<button

type="submit"

class="w-full bg-blue-900 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">


Create Account


</button>


</div>





</form>








<p class="text-center mt-6 text-gray-600">


Already have an account?


<a href="login.html"

class="text-blue-900 font-semibold hover:underline">


Login


</a>


</p>






<a href="index.html"

class="block text-center mt-4 text-gray-500 hover:text-blue-900">


← Previous Page



</a>






</div>






<!-- ================= FOOTER ================= -->



<footer class="bg-gray-900 text-white text-center py-5 mt-12">

<p class="font-semibold">
🎓 AlumniConnect
</p>


<p class="text-sm">
Email: support@alumniconnect.com | Phone: +91 98765 43210
</p>


<p class="text-xs mt-1">
© 2026 AlumniConnect | All Rights Reserved
</p>


</footer>



<script>


// PASSWORD STRENGTH CHECK


let password=document.getElementById("password");

let strength=document.getElementById("strength");



password.addEventListener("input",()=>{


let value=password.value;


let pattern=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;



if(value===""){

strength.innerHTML="";

}


else if(pattern.test(value)){


strength.innerHTML="✅ Strong Password";

strength.className="text-green-600 text-sm mt-2 font-semibold";


}

else{


strength.innerHTML=
"❌ Weak password: Use 8+ characters with uppercase, lowercase, number & special symbol";


strength.className="text-red-600 text-sm mt-2 font-semibold";


}


});








// FORM VALIDATION


document.getElementById("registerForm")

.addEventListener("submit",function(e){


e.preventDefault();



let pass=password.value;


let confirm=document.getElementById("confirmPassword").value;



if(pass!==confirm){


alert("Passwords do not match!");

return;


}




let pattern=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;



if(!pattern.test(pass)){


alert("Please create a strong password!");

return;


}



alert("Registration successful!");



});



</script>





</body>

</html>
