<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | AlumniConnect</title>
<meta name="description" content="Create your AlumniConnect account and join the alumni community.">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8 mx-4">
        <div class="text-center mb-8">  
        <div class="text-5xl">🎓</div>
            <h1 class="text-3xl font-bold text-blue-900 mt-3">AlumniConnect</h1>
            <p class="text-gray-500 mt-2">Create your alumni account</p>
        </div>

<!-- REGISTER FORM -->
<form id="registerForm" class="grid md:grid-cols-2 gap-5">

<!-- FULL NAME -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Full Name</label>
    <input type="text"
        placeholder="Enter your name"required
        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
</div>

<!-- EMAIL -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Email Address</label>
    <input type="email"
        placeholder="Enter email" require
        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
    </div>

<!-- PHONE -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Phone Number</label>
    <input type="tel"
    placeholder="+91 XXXXX XXXXX"
    required
    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
</div>

<!-- ROLE -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Account Type</label>
    <select class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
        <option>Select Role</option>
        <option>Student</option>
        <option>Alumni</option>
    </select>
</div>

<!-- DEPARTMENT -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Department</label>
    <select class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
        <option>Select Department</option>
        <option>Computer Science Engineering</option>
        <option>Electronics Engineering</option>
        <option>Mechanical Engineering</option>
        <option>Electrical Engineering</option>
        <option>Civil Engineering</option>
    </select>
</div>

<!-- PASSING YEAR -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Graduation Year</label>
    <select class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
        <option>Select Year</option>
        <option>2022</option>
        <option>2023</option>
        <option>2024</option>
        <option>2025</option>
        <option>2026</option>
    </select>
</div>

<!-- PASSWORD -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Password</label>
        <input id="password"
            type="password"
            placeholder="Create password"required
            class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
</div>

<!-- CONFIRM PASSWORD -->
<div>
    <label class="block font-semibold text-gray-700 mb-2">Confirm Password</label>
    <input id="confirmPassword"
        type="password"
        placeholder="Confirm password" required
        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-900 outline-none">
</div>

<!-- TERMS -->
<div class="md:col-span-2">
    <label class="flex items-center gap-2 text-gray-600">
    <input type="checkbox" required>I agree to Terms & Conditions</label>
</div>

<!-- BUTTON -->
<div class="md:col-span-2">
    <button type="submit"
    class="w-full bg-blue-900 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">
        Create Account
    </button>
</div>
</form>
<!-- LOGIN LINK -->
<p class="text-center mt-6 text-gray-600">Already have an account?
    <a href="login.html" class="text-blue-900 font-semibold hover:underline">Login</a>
</p>
    <a href="index.html" class="block text-center mt-4 text-gray-500 hover:text-blue-900"> Back to Home</a>

</div>

<script>
document.getElementById("registerForm")
.addEventListener("submit",function(e){
    e.preventDefault();
    let password=document.getElementById("password").value;
    let confirmPassword=document.getElementById("confirmPassword").value;
    if(password!==confirmPassword){
        alert("Passwords do not match");
        return;
    }
    alert("Registration successful!");
// Connect backend/database here later
}
);
</script>
</body>
</html>
